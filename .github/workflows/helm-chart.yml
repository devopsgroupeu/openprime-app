name: Build and Publish Helm Chart

on:
  push:
    branches: [main, dev]
    paths:
      - "chart/**"
      - "Dockerfile"
      - "package.json"
      - ".github/workflows/helm-chart.yml"
  pull_request:
    branches: [main]
    paths:
      - "chart/**"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HELM_CHART_PATH: ./chart

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.12.0"

      - name: Lint Helm Chart
        run: |
          helm lint ${{ env.HELM_CHART_PATH }}

      - name: Template Helm Chart
        run: |
          helm template test ${{ env.HELM_CHART_PATH }} --debug

  publish-docker:
    needs: lint-test
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-docker-publish.yml
    with:
      tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=sha,prefix={{branch}}-

  publish-chart:
    runs-on: ubuntu-latest
    needs: [lint-test, publish-docker]
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.12.0"

      - name: Log in to Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Update Chart Version
        run: |
          # Update chart version based on event type
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION=${VERSION#v} # Remove 'v' prefix if present
            # Update Chart.yaml for releases
            sed -i "s/^version:.*/version: ${VERSION}/" ${{ env.HELM_CHART_PATH }}/Chart.yaml
            sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" ${{ env.HELM_CHART_PATH }}/Chart.yaml
          else
            VERSION="0.0.0-${{ github.sha }}"
            sed -i "s/^version:.*/version: ${VERSION}/" ${{ env.HELM_CHART_PATH }}/Chart.yaml
            sed -i "s/^appVersion:.*/appVersion: \"${{ needs.publish-docker.outputs.image-version }}\"/" ${{ env.HELM_CHART_PATH }}/Chart.yaml
          fi

          # Update values.yaml to use the built image
          sed -i "s|repository:.*|repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}|" ${{ env.HELM_CHART_PATH }}/values.yaml
          sed -i "s/tag:.*/tag: \"${{ needs.publish-docker.outputs.image-version }}\"/" ${{ env.HELM_CHART_PATH }}/values.yaml

      - name: Package Helm Chart
        run: |
          helm package ${{ env.HELM_CHART_PATH }} --destination ./charts/

      - name: Push Helm Chart
        run: |
          CHART_VERSION=$(helm show chart ${{ env.HELM_CHART_PATH }} | grep '^version:' | awk '{print $2}')
          helm push ./charts/openprime-app-${CHART_VERSION}.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm
