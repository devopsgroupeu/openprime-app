name: Reusable Docker Publish

on:
  workflow_call:
    inputs:
      image_name:
        required: false
        type: string
        default: ${{ github.repository }}
      registry:
        required: false
        type: string
        default: ghcr.io
      tags:
        required: false
        type: string
        default: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,format=short,prefix=${{ github.ref_name }}-
          type=raw,value=latest,enable={{is_default_branch}}
    outputs:
      image-version:
        description: "The version of the image built"
        value: ${{ jobs.build.outputs.version }}
      image-digest:
        description: "The digest of the pushed (and signed) image"
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign, this job only
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.registry }}/${{ inputs.image_name }}
          tags: ${{ inputs.tags }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Own cache scope, so the amd64-only scan build and this multi-arch build
      # do not overwrite each other's cache.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
          platforms: linux/amd64,linux/arm64

      # Pinned explicitly (it is also this installer's default), so the README
      # can name the cosign version that verifies these signatures.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.image_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"
