name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

# One release at a time: two runs started by quick merges would both compute
# the same next version. A newer run waits; it supersedes an older waiting one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yml

  # Gate BEFORE semantic-release: if the image fails the scan, nothing is tagged,
  # no GitHub release or CHANGELOG commit is made, and no version number is burnt.
  scan:
    name: Image scan
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-image-scan.yml

  release:
    name: Semantic Release
    needs: [test, scan]
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Force fetch tags
        run: git fetch --tags --force

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pipefail: a failed release fails this step, after tee has already printed its log
          set -o pipefail
          npx semantic-release 2>&1 | tee semantic-release.log
          if grep -q "Published release" semantic-release.log; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version
        id: version
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  publish-docker:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write # caps the reusable workflow's keyless cosign signing
    uses: ./.github/workflows/reusable-docker-publish.yml
    with:
      tags: |
        type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
        type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}
        type=raw,value=latest

  publish-helm:
    needs: [release, publish-docker]
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-helm-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
      package-name: openprime-app
