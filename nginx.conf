# nginx server config for the OpenPrime frontend container.
# Included inside the http block (conf.d/*.conf), so log_format is valid here.

# JSON access log so the frontend container's logs share the OpenPrime schema
# ({timestamp, level, service, message, requestId}) and Loki parses every service
# the same way. requestId is empty for browser requests (they don't send the header).
log_format json_combined escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"level":"info",'
    '"service":"openprime-app",'
    '"message":"$request_method $uri $status",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"requestId":"$http_x_request_id",'
    '"remoteAddr":"$remote_addr",'
    '"userAgent":"$http_user_agent"'
  '}';

server {
    listen 8080;
    server_name localhost;

    access_log /dev/stdout json_combined;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets, so a given URL's bytes
    # never change — cache them hard and skip revalidation entirely.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    # index.html is the map from stable URL to hashed bundle, so it must never be
    # cached: without an explicit directive nginx sends no Cache-Control at all,
    # browsers fall back to heuristic freshness, and for a while after every
    # release users keep loading the PREVIOUS bundle from a stale index.html.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
        add_header Pragma 'no-cache';
        add_header Expires '0';
    }

    # Serve processed env.js from writable cache directory
    location = /env.js {
        alias /var/cache/nginx/env.js;
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
        add_header Pragma 'no-cache';
        add_header Expires '0';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
